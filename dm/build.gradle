// The display manager: starts Xorg (amadeos-dm), shows the login greeter, authenticates through PAM in a
// root worker and starts amadeos-session as the user. `amadeos-dm [display]`, `amadeos-dm session-worker`,
// `amadeos-dm greeter`.
application {
    mainClass = 'eu.amadeos.dm.DmLauncher'
}

debian = [
    section    : 'x11',
    javaOptions: '--enable-native-access=ALL-UNNAMED',
    // Xorg and xauth (amadeos-dm), xset and setxkbmap (the script), chvt (kbd), mcookie (util-linux,
    // essential), PAM with logind sessions; the session it starts.
    depends    : ['xserver-xorg', 'xauth', 'x11-xserver-utils', 'kbd', 'libpam-systemd', 'amadeos-session'],
    conflicts  : ['amade-desktop', 'amade-dm'],
    replaces   : ['amade-desktop', 'amade-dm'],
    summary    : 'Display manager and login greeter of amadeOS',
    description: '''Starts Xorg at boot (amadeos-dm.service) and shows the login greeter of the amadeOS
desktop: language and time zone of the session, power actions. Authenticates
through PAM (/etc/pam.d/amadeos-dm) in a root worker process, opens a logind
session and starts amadeos-session as the user. As root it sets the system
time zone chosen in the greeter.'''
]
