// Software: find, install, update and remove software (ROADMAP M15). One program for all of it: the Updates
// tab lists the waiting updates (the front panel's updates cell opens it there with --updates), the
// catalog tabs follow. Talks to apt only through PackageService (module packages).
application {
    mainClass = 'eu.amadeos.system.software.bootstrap.AmadeSoftwareApplication'
}

dependencies {
    // PackageService, bundled into the jar like base into the desktop modules.
    implementation project(':packages')
}

debian = [
    section    : 'admin',
    // The helper that installs, upgrades and removes.
    depends    : ['amadeos-packages'],
    summary    : 'Software manager of amadeOS',
    description: '''Installs the waiting software updates (all of them or the security updates
only) with a progress display and the apt log, shows what each update is,
tells when a restart is needed, and turns automatic security updates on or
off. The front panel's updates cell opens it. Part of the amadeOS desktop.'''
]
