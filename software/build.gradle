// Software: find, install, update and remove software (ROADMAP M15). One program for all of it: the Updates
// tab lists the waiting updates (the front panel's updates cell opens it there with --updates), the
// catalog tabs (Applications, Command line, Other, Libraries) everything else. Talks to apt only
// through PackageService (module packages).
application {
    mainClass = 'eu.amadeos.system.software.bootstrap.AmadeSoftwareApplication'
}

dependencies {
    // PackageService, bundled into the jar like base into the desktop modules.
    implementation project(':packages')
    // The AppStream data (DEP-11) is YAML.
    implementation 'org.yaml:snakeyaml:2.3'
    // The details pane: descriptions and screenshots as XHTML, like amade-web.
    implementation 'org.xhtmlrenderer:flying-saucer-core:9.9.0'
}

debian = [
    section    : 'admin',
    // The helper that installs, upgrades and removes.
    // appstream makes apt fetch the AppStream data (names, descriptions, icons, screenshots of the
    // applications); packaging/root/etc/apt/apt.conf.d/60amadeos-software adds the icons.
    depends    : ['amadeos-packages', 'appstream'],
    // Reading the catalog (apt-cache dumpavail, about 100 MB of text) and the AppStream data makes a lot of
    // short-lived garbage, while the data kept is about 50 MB. With the JVM's defaults (G1, a heap of up to a
    // quarter of the RAM) the heap grew to that garbage and stayed there: 600 to 800 MB after a start or an
    // upgrade (the catalog is read again afterwards). The serial collector with a capped heap that gives
    // unused memory back keeps the program near 250 MB; the collections take well under a second in all.
    javaOptions: '-XX:+UseSerialGC -Xmx256m -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30',
    summary    : 'Software manager of amadeOS',
    description: '''Finds, installs, updates and removes software. Applications, command-line
programs and libraries each have a tab, with one search over all of them.
Installs the waiting updates (all of them or the security updates only) with
a progress display and the apt log, tells when a restart is needed, and turns
automatic security updates on or off. The front panel's updates cell opens
it. Part of the amadeOS desktop.'''
]
