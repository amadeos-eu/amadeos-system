// The desktop: window manager, front panel, display manager with login greeter, screen lock, screen saver,
// Style Manager and input tool. One jar; the first argument selects the component (see AmadeOsLauncher).
application {
    mainClass = 'org.datazuul.amadeos.wm.AmadeOsLauncher'
}

// The desktop logs through java.util.logging; amade-commons' SLF4J output goes there too.
slf4jBinding = 'org.slf4j:slf4j-jdk14:2.0.17'

dependencies {
    // Xlib, Xss and libc through JNA.
    implementation 'net.java.dev.jna:jna:5.14.0'
}

configurations.configureEach {
    // The desktop does not use the Guice-based application start-up of amade-commons.
    exclude group: 'com.google.inject'
}

test {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('runPanel', JavaExec) {
    group = 'application'
    description = 'Runs the front panel on your current desktop'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.datazuul.amadeos.wm.panel.AmadeDesktopPanel'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
    systemProperties = System.properties
}

debian = [
    section    : 'x11',
    javaOptions: '--enable-native-access=ALL-UNNAMED',
    // What the scripts of the desktop call: Xorg and xauth (display manager), xset, xmodmap, xrdb,
    // xsetroot (input settings, session), xprop (session), chvt (kbd), mcookie (util-linux), the
    // MIT-SCREEN-SAVER library (screen saver), PAM with logind sessions, NetworkManager and polkit
    // for the network cell of the front panel.
    depends    : ['xserver-xorg', 'xauth', 'x11-xserver-utils', 'x11-utils', 'kbd', 'util-linux', 'libxss1',
                  'libpam-systemd', 'network-manager', 'polkitd'],
    recommends : ['xterm'],
    summary    : 'Window manager, front panel, display manager and settings of amadeOS',
    description: '''The desktop of amadeOS in the style of CDE: a reparenting X11 window manager
with Motif frames and four workspaces, the front panel with clock, workspace
switcher and drawers, the display manager with its login greeter (PAM), the
screen lock and screen saver, the Style Manager and the input settings tool.
Start a component with amade-desktop <dm|wm|panel|style|screen|input|lock>.'''
]
