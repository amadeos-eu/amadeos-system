# Desktop portals of the amadeOS session. The session names itself "amadeOS:GNOME" in XDG_CURRENT_DESKTOP
# (so that Electron and Chromium programs keep passwords in gnome-keyring); xdg-desktop-portal reads this
# file first, for "amadeOS", and so does not pick GNOME's portal, which needs GNOME Shell. File dialogs and
# the rest come from the GTK portal if it is installed, otherwise from any portal there is; passwords of
# sandboxed programs (Flatpak) go to gnome-keyring.
[preferred]
default=gtk;*
org.freedesktop.impl.portal.Secret=gnome-keyring
