# Desktop portals of the amadeOS session. The session names itself "amadeOS:GNOME" in XDG_CURRENT_DESKTOP
# (so that Electron and Chromium programs keep passwords in gnome-keyring); xdg-desktop-portal reads this
# file first, for "amadeOS", and so does not pick GNOME's portal. File dialogs and the rest come from the GTK
# portal (xdg-desktop-portal-gtk) and from no other: GNOME's portal (installed on Ubuntu, for example) waits
# for GNOME Shell, which this session does not run, and every program asking it waited 25 seconds for the
# D-Bus timeout before its file dialog or its window appeared. Without the GTK portal programs get an error at
# once and show their own dialogs. Passwords of sandboxed programs (Flatpak) go to gnome-keyring.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
