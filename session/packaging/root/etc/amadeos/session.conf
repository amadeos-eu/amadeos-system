# /etc/amadeos/session.conf
# Settings of the amadeOS desktop session (amadeos-session); ~/.config/amadeos/session.conf overrides them.

# The window manager (package amade-wm) and its supervision
WM_COMMAND="/usr/bin/amade-wm"
WM_ENABLED="true"
WM_AUTO_RESTART="true"
WM_LOG_FILE="${XDG_CACHE_HOME:-${HOME:-/tmp}/.cache}/amadeos/logs/wm.log"

# Session logging (the Tools drawer's log viewer lists ~/.cache/amadeos/logs)
SESSION_LOG_FILE="${XDG_CACHE_HOME:-${HOME:-/tmp}/.cache}/amadeos/logs/session.log"

# Primary desktop autostart application: 'panel' is /usr/bin/amade-panel, the installed panel
# (amade-panel-cde or another package providing amade-panel); or a custom command
AUTOSTART_APP="panel"

