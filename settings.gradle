rootProject.name = 'amadeos-system'

// System components of amadeOS, one Debian package per module; base is the library the desktop
// modules (wm, panel-cde, dm, session, settings, logviewer) share; packages is the apt library under the
// package-management modules (ROADMAP M15).
include 'base'
include 'wm'
include 'panel-cde'
include 'panel-horizon'
include 'dm'
include 'session'
include 'settings'
include 'logviewer'
include 'print'
include 'sysinfo'
include 'packages'
include 'software'
include 'taskmanager'
include 'widgets'
include 'icons-horizon'

// Develop against a local amade-commons checkout next to this one; without it, the version from
// JitPack given in build.gradle is used.
if (file('../amade-commons/settings.gradle').exists()) {
    includeBuild '../amade-commons'
}
