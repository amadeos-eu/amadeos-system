rootProject.name = 'amadeos-system'

// System components of amadeOS, one Debian package per module; base is the library the desktop
// modules (wm, panel-cde, dm, session, style, logviewer) share.
include 'base'
include 'wm'
include 'panel-cde'
include 'dm'
include 'session'
include 'style'
include 'logviewer'
include 'print'
include 'sysinfo'

// Develop against a local amade-commons checkout next to this one; without it, the version from
// JitPack given in build.gradle is used.
if (file('../amade-commons/settings.gradle').exists()) {
    includeBuild '../amade-commons'
}
