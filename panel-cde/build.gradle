// The CDE Front Panel: the dock with clock, calendar, workspace switcher, lock and language buttons, the
// network, sound, battery and updates cells and the drawers listing the installed applications. `amadeos-panel-cde`; installed as the
// alternative /usr/bin/amadeos-panel, which amadeos-session starts.
application {
    mainClass = 'eu.amadeos.system.panel.cde.AmadeDesktopPanel'
}

dependencies {
    // PackageService for the updates cell, bundled into the panel's jar.
    implementation project(':packages')
}

debian = [
    section    : 'x11',
    javaOptions: '--enable-native-access=ALL-UNNAMED',
    // NetworkManager and polkit for the network cell, pactl (PipeWire through pipewire-pulse) for the sound cell.
    depends    : ['network-manager', 'polkitd', 'pulseaudio-utils'],
    // The window manager, the programs of the Tools drawer and the Printers slot, and the helper through
    // which the updates cell installs (without it the cell still shows the pending updates).
    recommends : ['amadeos-wm', 'amadeos-logviewer', 'amadeos-sysinfo', 'amadeos-print', 'amadeos-settings',
                  'amadeos-packages'],
    provides   : ['amadeos-panel'],
    conflicts  : ['amade-desktop', 'amade-panel-cde'],
    replaces   : ['amade-desktop', 'amade-panel-cde'],
    summary    : 'CDE Front Panel of amadeOS',
    description: '''The front panel of the amadeOS desktop in the style of CDE: clock, calendar,
workspace switcher, lock and language buttons, the network cell, the sound cell
(volume, output and input device), a battery cell on computers with a battery, a bell for the notifications
(unseen count, history, Do not disturb), a cell for
waiting software updates and drawers that list the installed applications from their .desktop files. Provides
amadeos-panel: amadeos-session starts /usr/bin/amadeos-panel, which this package
registers as an alternative, so another panel can take its place.'''
]
