// Shared build of all modules: Java 25, amade-commons, JUnit 5, a fat jar per application module and
// the tasks `deb` (a Debian package) and `installToAmadeOs` (that package into
// ../amadeos/config/packages.chroot). Each application module sets mainClass and the `debian` block in its
// own build.gradle; `base` is the library the desktop modules share and has no package of its own.
// `packages` is a library too (bundled into the modules that use it), but has a package: amadeos-packages
// with the root helper and polkit action and no jar.

// --8<-- [start:desktop-modules]
// The modules of the desktop: they build on base, log through java.util.logging and talk to X11 through
// JNA, so they run with native access enabled.
def desktopModules = ['wm', 'panel-cde', 'dm', 'session', 'style', 'logviewer', 'taskmanager']
// Libraries: no main class and no program of their own.
def libraryModules = ['base', 'packages']
// --8<-- [end:desktop-modules]

subprojects {
    apply plugin: 'java'

    group = 'eu.amadeos.system'
    // CI computes the version from the Conventional Commits since the last release tag and passes it as
    // -PappVersion (amadeos-eu/amadeos-ci scripts/next-version.sh); a build without it is a local development
    // build. All modules share it.
    version = rootProject.findProperty('appVersion') ?: '0.0.0-dev.0'
    // Debian sorts 1.1.0~dev.57 before 1.1.0 (with - it would sort after it).
    ext.debVersion = version.toString().replace('-', '~')

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        // Theme, Motif look, start-up and XDG helpers shared by all amadeOS applications.
        // With ../amade-commons checked out, settings.gradle builds that checkout instead (composite build).
        implementation 'com.github.amadeos-eu:amade-commons:d25654834c'
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
        // Tests compare English texts, whatever the language of the build machine.
        systemProperty 'user.language', 'en'
        systemProperty 'user.country', 'US'
    }
}

// The application modules: a main class, a fat jar and a Debian package each.
configure(subprojects.findAll { !(it.name in libraryModules) }) {
    apply plugin: 'application'

    // The SLF4J binding of the module's jar; the desktop modules log through java.util.logging instead.
    ext.slf4jBinding = 'ch.qos.logback:logback-classic:1.5.18'
}

configure(subprojects.findAll { it.name != 'base' }) {
    ext.debian = [:]
}

// --8<-- [start:desktop-config]
configure(subprojects.findAll { it.name in desktopModules }) {
    slf4jBinding = 'org.slf4j:slf4j-jdk14:2.0.17'

    dependencies {
        // The X11, PAM, XDG, theme and process helpers shared by the desktop modules (JNA comes with them).
        implementation project(':base')
    }

    configurations.configureEach {
        // The desktop does not use the Guice-based application start-up of amade-commons.
        exclude group: 'com.google.inject'
    }

    application {
        applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
    }

    test {
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
}
// --8<-- [end:desktop-config]

configure(subprojects.findAll { it.name != 'base' }) {

    afterEvaluate {
        def packageName = "amadeos-${project.name}"
        // A program brings its fat jar and launcher; a library's package (amadeos-packages) only its files.
        def program = project.plugins.hasPlugin('application')

        if (program) dependencies {
            runtimeOnly project.slf4jBinding
        }

        if (program) jar {
            archiveBaseName = packageName
            manifest {
                attributes(
                    'Main-Class': application.mainClass.get(),
                    'Implementation-Title': packageName,
                    'Implementation-Version': project.version,
                    // LaunchFeedback (amade-commons) talks to the X server through the foreign function API.
                    'Enable-Native-Access': 'ALL-UNNAMED'
                )
            }
            // The fat jar unpacks the runtime class path, so the jars of the modules it depends on come first.
            dependsOn configurations.runtimeClasspath
            from {
                configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
            }
            // Signed dependency jars would otherwise invalidate the fat jar.
            exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }

        tasks.register('deb') {
            if (program) dependsOn jar
            description = "Builds a standard Debian (.deb) package for ${packageName}"
            group = 'distribution'

            doLast {
                def deb = project.debian
                def buildDirFile = layout.buildDirectory.get().asFile
                def stagingDir = new File(buildDirFile, 'deb-staging')
                delete(stagingDir)

                def optDir = new File(stagingDir, "opt/${packageName}")
                def binDir = new File(stagingDir, 'usr/bin')
                // A module whose own script has the package's name (amadeos-session, amadeos-dm) keeps
                // the jar launcher in /usr/libexec, where the script calls it.
                def launcherDir = file("packaging/root/usr/bin/${packageName}").exists()
                        ? new File(stagingDir, 'usr/libexec') : binDir
                def appDir = new File(stagingDir, 'usr/share/applications')
                def docDir = new File(stagingDir, "usr/share/doc/${packageName}")
                def debianDir = new File(stagingDir, 'DEBIAN')
                def distDir = new File(buildDirFile, 'distributions')
                [docDir, debianDir, distDir]*.mkdirs()

                if (program) {
                    [optDir, binDir, launcherDir, appDir]*.mkdirs()
                    copy {
                        from jar.archiveFile
                        into optDir
                        rename { "${packageName}.jar" }
                    }

                    def javaOptions = deb.javaOptions ? "${deb.javaOptions} " : ''
                    def launcher = new File(launcherDir, packageName)
                    launcher.text = """#!/bin/sh
exec /usr/bin/java ${javaOptions}-jar /opt/${packageName}/${packageName}.jar "\$@"
"""
                    launcher.setExecutable(true, false)
                }

                // Applications bring a menu entry; the desktop itself has none.
                if (program && file("packaging/${packageName}.desktop").exists()) {
                    copy {
                        from "packaging/${packageName}.desktop"
                        into appDir
                    }
                } else {
                    appDir.deleteDir()
                }
                copy {
                    from rootProject.file('LICENSE')
                    into docDir
                    rename { 'copyright' }
                }
                // Scripts and system files of the module (packaging/root mirrors the file system: usr/bin,
                // etc/..., usr/lib/systemd/system). Everything under etc/ is a conffile, so dpkg keeps the
                // administrator's changes on upgrades.
                def rootTree = file('packaging/root')
                def conffiles = []
                if (rootTree.isDirectory()) {
                    copy {
                        from rootTree
                        into stagingDir
                    }
                    fileTree(new File(rootTree, 'etc')).visit { details ->
                        if (!details.isDirectory()) conffiles << "/etc/${details.relativePath.pathString}"
                    }
                }
                if (conffiles) new File(debianDir, 'conffiles').text = conffiles.sort().join('\n') + '\n'
                // Debian permissions whatever the umask of the checkout: directories 0755, files 0644 or 0755.
                fileTree(stagingDir).visit { details ->
                    def executable = details.isDirectory() || details.file.canExecute()
                    java.nio.file.Files.setPosixFilePermissions(details.file.toPath(),
                            java.nio.file.attribute.PosixFilePermissions.fromString(executable ? 'rwxr-xr-x' : 'rw-r--r--'))
                }
                java.nio.file.Files.setPosixFilePermissions(stagingDir.toPath(),
                        java.nio.file.attribute.PosixFilePermissions.fromString('rwxr-xr-x'))
                // Maintainer scripts (postinst, prerm, postrm, preinst) from packaging/debian.
                def maintainerScripts = file('packaging/debian')
                if (maintainerScripts.isDirectory()) {
                    copy {
                        from maintainerScripts
                        into debianDir
                    }
                    ['preinst', 'postinst', 'prerm', 'postrm'].each { name ->
                        def script = new File(debianDir, name)
                        if (script.exists()) script.setExecutable(true, false)
                    }
                }

                def depends = ((program ? ['openjdk-25-jre | java-runtime (>= 25)'] : []) + (deb.depends ?: [])).join(', ')
                def control = """Package: ${packageName}
Version: ${project.debVersion}
Section: ${deb.section}
Priority: optional
Architecture: all
Depends: ${depends}
"""
                if (deb.recommends) control += "Recommends: ${deb.recommends.join(', ')}\n"
                if (deb.provides) control += "Provides: ${deb.provides.join(', ')}\n"
                if (deb.conflicts) control += "Conflicts: ${deb.conflicts.join(', ')}\n"
                if (deb.replaces) control += "Replaces: ${deb.replaces.join(', ')}\n"
                control += """Maintainer: amadeOS Project <developers@datazuul.com>
Description: ${deb.summary}
${deb.description.readLines().collect { ' ' + it }.join('\n')}
"""
                new File(debianDir, 'control').text = control

                def debFile = new File(distDir, "${packageName}_${project.debVersion}_all.deb")
                def process = new ProcessBuilder('dpkg-deb', '--root-owner-group', '--build',
                        stagingDir.absolutePath, debFile.absolutePath)
                        .redirectErrorStream(true)
                        .start()
                process.inputStream.eachLine { println it }
                if (process.waitFor() != 0) {
                    throw new GradleException('dpkg-deb failed')
                }
                println "[deb] Created ${debFile.absolutePath}"
            }
        }

        tasks.register('installToAmadeOs') {
            dependsOn 'deb'
            description = 'Builds and drops the .deb package into ../amadeos/config/packages.chroot/'
            group = 'distribution'

            doLast {
                def targetDir = rootProject.file('../amadeos/config/packages.chroot')
                targetDir.mkdirs()
                def debFile = new File(layout.buildDirectory.get().asFile,
                        "distributions/${packageName}_${project.debVersion}_all.deb")
                copy {
                    from debFile
                    into targetDir
                }
                println "[installToAmadeOs] Copied ${debFile.name} to ${targetDir.absolutePath}"
            }
        }
    }
}
