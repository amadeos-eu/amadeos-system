application {
    mainClass = 'eu.amadeos.system.print.bootstrap.AmadePrintApplication'
}

debian = [
    section    : 'utils',
    // The live image installs CUPS too; the package works with any CUPS server it can reach.
    recommends : ['cups', 'cups-client', 'cups-filters'],
    // Renamed from amade-print when the system packages became amadeos-*.
    conflicts  : ['amade-print'],
    replaces   : ['amade-print'],
    summary    : 'Printer and print job manager for amadeOS',
    description: '''Shows the CUPS printers with their state and the print jobs of each printer.
Cancels, holds and releases jobs, pauses and resumes printers, prints a test
page and opens the CUPS administration to add printers. Talks to CUPS with
IPP over its local socket. Part of the amadeOS desktop.'''
]
