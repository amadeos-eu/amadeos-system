# amadeos-memory: kernel settings for the compressed swap in memory and for programs that watch many files.
# To change one, put a file of the same name into /etc/sysctl.d/ and run: sudo sysctl --system

# Swap in memory is cheap, so moving unused program memory there is as good as dropping file caches
# (the kernel default 60 prefers dropping caches, which makes the desktop slow when memory gets tight).
vm.swappiness = 100
# Read one page at a time from zram; reading ahead only helps on disks.
vm.page-cluster = 0

# Visual Studio Code, IDEs, file managers and sync tools watch every folder of a project for changes. The
# kernel default depends on the memory and can be too low for big projects (VS Code then says "unable to
# watch for file changes"). The limits cost nothing until the watches are made.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024
