# amadeOS (package amadeos-memory). Override with a file of the same name in /etc/sysctl.d/.

# zram swap is much faster than reading program code back from disk: swap out idle memory early instead of
# dropping the page cache, read swapped pages one at a time and don't let reclaim run in bursts. The values
# other desktops use with zram (Pop!_OS, ChromeOS).
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Editors and IDEs (VS Code, IntelliJ) watch every file of the open folders. The kernel's default depends on the
# RAM and is too small for a few large repositories; a watch costs about 1 KB of kernel memory only when used.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
