# amadeos-memory: earlyoom for the amadeOS desktop. When less than 10 % of the memory and less than 10 % of
# the swap are free, earlyoom ends the program with the highest OOM score: the one that uses the most memory.
# Without it the kernel waits until nothing is left; by then the desktop has been frozen for minutes.
# Never chosen: the X server, the display manager, systemd and the system services the desktop needs.
# The amadeOS programs and the desktop itself have a memory limit each (/etc/amadeos/java/*.options), so
# they are small and not chosen while a bigger program runs. Own options go into EARLYOOM_ARGS in
# /etc/default/earlyoom; they come last and win.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 0 --avoid '^(Xorg|Xwayland|amadeos-dm|systemd|systemd-.*|dbus-daemon|dbus-broker|polkitd|NetworkManager|sshd|pipewire|wireplumber)$$' $EARLYOOM_ARGS
