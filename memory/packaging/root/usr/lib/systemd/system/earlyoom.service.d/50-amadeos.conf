# amadeOS (package amadeos-memory): when less than 5 % (at most 800 MB) of the memory and less than 10 % of the
# swap are free, earlyoom ends the program with the highest OOM score, before the kernel would and before the
# desktop stalls. It spares X, the Java desktop (window manager, panel and amade programs, whose heaps are capped)
# and system services, and ends browsers, VS Code and other Electron programs first.
# Replaces the arguments of /etc/default/earlyoom. To change them, put a file of the same name into
# /etc/systemd/system/earlyoom.service.d/. "$$" is a literal "$" for systemd.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 5 -M 819200 -s 10 \
    --avoid '^(Xorg|X|java|amadeos-.*|systemd.*|dbus-.*|sshd|pipewire.*|wireplumber|pulseaudio|earlyoom)$$' \
    --prefer '^(code|electron.*|chrome|chromium|firefox.*|Isolated Web Co|Web Content|claude.*|soffice\.bin|thunderbird.*)$$'
