# amadeos-memory: compressed swap in memory. systemd-zram-generator creates /dev/zram0 at boot. It holds up to
# half of the memory (at most 8 GB) of pages the programs do not use at the moment; compressed with zstd they
# take about a third of that. It is used before a swap partition on the disk (priority 100).
# To change it, put a file of the same name into /etc/systemd/zram-generator.conf.d/ (or a link to /dev/null
# to switch zram off) and restart: sudo systemctl daemon-reload && sudo systemctl restart systemd-zram-setup@zram0
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
