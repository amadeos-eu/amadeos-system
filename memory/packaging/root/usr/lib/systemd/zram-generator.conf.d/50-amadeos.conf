# amadeOS (package amadeos-memory): compressed swap in RAM. The installer creates no swap partition by default,
# so without it a full memory froze the desktop. zstd packs typical program memory to a third or less, so the
# device, as large as the RAM up to 8 GB, takes at most about a third of the RAM when it is full.
# To change it, put a file of the same name into /etc/systemd/zram-generator.conf.d/.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
swap-priority = 100
