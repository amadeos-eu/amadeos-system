name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Plain actions/cache instead of the proprietary enhanced cache that is the v6 default.
          cache-provider: basic
      # The X11 integration tests of the desktop start their own Xvfb and use xmessage as a test client.
      - name: Install X11 test tools
        run: sudo apt-get update -q && sudo apt-get install -y -q x11-utils xvfb
      - name: Test
        run: xvfb-run --auto-servernum ./gradlew test --no-daemon
      - name: Check that the tests ran
        run: |
          for module in desktop print sysinfo; do
            count=$(grep -ho 'tests="[0-9]*"' $module/build/test-results/test/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
            skipped=$(grep -ho 'skipped="[0-9]*"' $module/build/test-results/test/*.xml | grep -o '[0-9]*' | paste -sd+ | bc)
            echo "$module: tests run: $count, skipped: $skipped"
            test "$count" -ge 10
            # The desktop skips one test when the amadeos-backdrops-cde package is not installed.
            if [ "$module" = desktop ]; then test "$skipped" -le 1; else test "$skipped" -eq 0; fi
          done
      - name: Package
        run: ./gradlew deb --no-daemon
      - name: Check the packages
        run: |
          for module in desktop print sysinfo; do
            name=amade-$module
            jar=$(ls $module/build/libs/$name-*.jar)
            unzip -p "$jar" META-INF/MANIFEST.MF | grep -q "Main-Class: org.datazuul.amadeos."
            deb=$(ls $module/build/distributions/${name}_*_all.deb)
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" > contents.txt
            for f in opt/$name/$name.jar usr/bin/$name usr/share/doc/$name/copyright; do
              grep -q "$f" contents.txt || { echo "missing in $name: $f"; exit 1; }
            done
            if [ -f $module/packaging/$name.desktop ]; then
              grep -q "usr/share/applications/$name.desktop" contents.txt || { echo "missing in $name: menu entry"; exit 1; }
            fi
            # Everything from packaging/root is in the package, the files under etc/ as conffiles.
            if [ -d $module/packaging/root ]; then
              rm -rf control-$name && dpkg-deb --control "$deb" control-$name
              (cd $module/packaging/root && find . -type f) | while read -r f; do
                grep -q " \${f}\$" contents.txt || { echo "missing in $name: $f"; exit 1; }
                case "$f" in ./etc/*) grep -qx "${f#.}" control-$name/conffiles || { echo "not a conffile in $name: $f"; exit 1; } ;; esac
              done
              for script in $module/packaging/debian/*; do
                test -x control-$name/$(basename $script) || { echo "missing in $name: $(basename $script)"; exit 1; }
              done
            fi
          done
      - name: Upload the Debian packages
        uses: actions/upload-artifact@v7
        with:
          name: amade-system-debs
          path: '*/build/distributions/*.deb'
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/test'
